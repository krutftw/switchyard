[package]
name = "switchyard-upstream"
description = "Transport to upstream LLM providers for Switchyard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
switchyard-core.workspace = true
tokio.workspace = true
futures.workspace = true
async-stream.workspace = true
bytes.workspace = true
http.workspace = true
url.workspace = true
percent-encoding.workspace = true
reqwest.workspace = true
rustls.workspace = true
rustls-native-certs.workspace = true
webpki-roots.workspace = true
tokio-tungstenite.workspace = true
# TLS for WebSocket connections (to the upstream, and to `https://` proxies
# when tunnelling). No crypto provider feature: the connector is always
# handed an explicit ring-backed config.
tokio-rustls = { version = "0.26", default-features = false }
serde_json.workspace = true
ring.workspace = true
pem.workspace = true
base64.workspace = true
chrono.workspace = true
httpdate = "1"
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `start_paused` lets the mock provider's pacing be tested without waiting.
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
flate2 = "1"
