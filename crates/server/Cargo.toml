[package]
name = "switchyard-server"
description = "Client-facing HTTP, SSE and WebSocket API for Switchyard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
switchyard-core.workspace = true
switchyard-codecs.workspace = true
switchyard-gateway.workspace = true
switchyard-telemetry.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
bytes.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
percent-encoding.workspace = true
# Query strings are parsed by hand: the route table matches on the raw path.
form_urlencoded = "1"
# Client WebSockets are driven with the same library (and message type) as
# the upstream ones, so the Realtime relay forwards frames without converting
# them and the Responses endpoint can drain a socket it has to refuse.
tokio-tungstenite.workspace = true
# The accept loop: HTTP/1.1 + HTTP/2 per connection, upgrades, graceful
# shutdown with a deadline.
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "server-graceful", "service", "http1", "http2"] }
# HTTPS. No crypto provider feature: the acceptor is always handed a config
# built with an explicit ring provider (never aws-lc).
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false }
# Request bodies sent with a Content-Encoding.
flate2 = "1"
brotli = { version = "9", default-features = false, features = ["std"] }
zstd = { version = "0.14", default-features = false }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true
reqwest.workspace = true
# Captures every log line of a test, to check that no credential is in one.
tracing-subscriber.workspace = true
# `start_paused` lets keep-alive timing be tested without waiting.
tokio = { workspace = true, features = ["test-util"] }
# A self-signed certificate for the TLS test (ring backend, like the server).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
