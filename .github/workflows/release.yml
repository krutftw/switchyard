name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, musl: true }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked -p switchyard --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="switchyard-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          bin="target/${{ matrix.target }}/release/switchyard"
          if [[ "${{ matrix.target }}" == *windows* ]]; then bin="${bin}.exe"; fi
          cp "${bin}" "dist/${name}/"
          cp README.md LICENSE NOTICE switchyard.example.toml "dist/${name}/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi
          rm -rf "${name}"
          ls -la

      - uses: actions/upload-artifact@v7
        with:
          name: switchyard-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: switchyard-*
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la dist
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Switchyard ${TAG}" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

  docker:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: switchyard-*-linux-musl
          merge-multiple: true
      - name: Unpack musl binaries
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p ctx/bin/amd64 ctx/bin/arm64
          tar -xzf "dist/switchyard-${version}-x86_64-unknown-linux-musl.tar.gz" -C dist
          tar -xzf "dist/switchyard-${version}-aarch64-unknown-linux-musl.tar.gz" -C dist
          cp "dist/switchyard-${version}-x86_64-unknown-linux-musl/switchyard" ctx/bin/amd64/
          cp "dist/switchyard-${version}-aarch64-unknown-linux-musl/switchyard" ctx/bin/arm64/
          cp docker/Dockerfile.release ctx/Dockerfile
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image tags
        id: tags
        run: |
          version="${TAG#v}"
          repo="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "tags=${repo}:${version},${repo}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=Switchyard LLM API gateway
