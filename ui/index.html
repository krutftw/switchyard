<!doctype html>
<html lang="en" translate="no" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#101316" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Switchyard</title>

    <!--
      Theme bootstrap. A blocking classic script, ahead of the stylesheets, so
      it has run before the first paint and the page never flashes the wrong
      theme: a stored choice wins, otherwise the operating system decides.
      js/lib/theme.js applies the same rule once the app is running.

      It is a file on purpose. The gateway serves this page with
      "Content-Security-Policy: script-src 'self'": an inline script or an
      inline event handler here would be refused. Keep this document free of
      both.

      Everything is local: no fonts, scripts or styles are fetched from
      another origin, so the dashboard works on an air-gapped host.
    -->
    <script src="js/theme-boot.js"></script>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!--
      The two fonts: preloaded, and declared right here rather than in
      css/tokens.css. On a reload Chrome reuses the parsed tokens.css of the
      previous page together with the font files it had already fetched, so
      the fresh preloads went unused and the console said so ("preloaded but
      not used within a few seconds"). A font face declared in this document
      is fetched by this document, through its preload. Keep each url() equal
      to its preload's href, and the preloads `crossorigin`: fonts are always
      fetched in CORS mode, and a preload in another mode is not reused.
      (Inline styles are allowed by the policy: style-src 'unsafe-inline'.)
    -->
    <link rel="preload" href="fonts/archivo-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("fonts/archivo-latin-var.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/jetbrains-mono-latin-var.woff2") format("woff2");
        font-weight: 100 800;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="modulepreload" href="vendor/preact-htm.js" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app">
      <!-- Shown until js/app.js renders; replaced on boot. -->
      <div class="boot">
        <div class="boot-inner">
          <div class="boot-brand">
            <svg class="logo-mark" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 16.5h20" stroke="currentColor" stroke-width="2" opacity="0.45" />
              <path d="M2 16.5h5.5c4.5 0 4.5-9 9-9H19" stroke="var(--accent)" stroke-width="2" />
              <circle cx="20.5" cy="7.5" r="1.9" fill="var(--accent)" />
            </svg>
            <span>Switchyard</span>
          </div>
          <noscript>
            <p>The Switchyard dashboard needs JavaScript. Enable it for this address and reload.</p>
          </noscript>
        </div>
      </div>
    </div>
  </body>
</html>
